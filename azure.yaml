# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agent-framework
metadata:
    template: azd-init@1.29.0
infra:
    provider: bicep
    path: infra
    module: main
hooks:
    preprovision:
        shell: pwsh
        run: ./scripts/prepare-certificate.ps1
        interactive: false
        continueOnError: false
    postdeploy:
        shell: pwsh
        run: ./scripts/postdeploy.ps1
    postprovision:
        shell: pwsh
        run: ./scripts/provision-client-secret.ps1
        interactive: false
        continueOnError: false

services:
    agent-framework:
        project: .
        host: containerapp
        language: docker # dotnet
        docker:
            remoteBuild: true
            buildArgs:
            - NUGET_PACKAGES_REPO=${NUGET_PACKAGES_REPO}
            - DEFINE_CONSTANTS=${DEFINE_CONSTANTS}
